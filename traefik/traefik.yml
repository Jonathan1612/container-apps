# ============================================================
# Traefik v3 — Configuración estática
# ============================================================

api:
  dashboard: true
  insecure: false

# Puntos de entrada de red
entryPoints:
  http:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: https
          scheme: https
          permanent: true
  https:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt

# Proveedor Docker — detecta contenedores automáticamente
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false   # Solo expone contenedores con label traefik.enable=true
    network: proxy
  file:
    directory: /config        # Configuración dinámica (middlewares, etc.)
    watch: true

# Certificados SSL automáticos con Let's Encrypt
certificatesResolvers:
  letsencrypt:
    acme:
      storage: /acme.json
      tlsChallenge: {}         # Challenge TLS en puerto 443 (evita conflicto con redirect HTTP→HTTPS)

# Logs
log:
  level: INFO

accessLog:
  filePath: ""                # Logs de acceso en stdout
