name: Deploy app (reusable)
# ============================================================
# Workflow reutilizable — llámalo desde cualquier repo de app
#
# En tu repo de app, crea .github/workflows/deploy.yml con:
#
#   jobs:
#     deploy:
#       uses: Jonathan1612/container-apps/.github/workflows/deploy-app.yml@dev
#       with:
#         app_name: mi-api          # nombre en apps.yml
#       secrets: inherit
#
# Secrets necesarios en el repo de la app (o Variables con los mismos nombres):
#   DO_HOST, DO_USER, DO_SSH_KEY — credenciales SSH del servidor
# Preferir Secrets para DO_SSH_KEY (la clave privada no debe ir en Variables).
# ============================================================

on:
  workflow_call:
    inputs:
      app_name:
        description: 'Nombre de la app (debe coincidir con apps.yml)'
        required: true
        type: string
      branch:
        description: 'Rama a desplegar'
        required: false
        type: string
        default: 'main'
      frontend_domain:
        description: 'Dominio del frontend (ej: time.jacm.com.mx)'
        required: false
        type: string
        default: ''
      backend_domain:
        description: 'Dominio del backend/API (ej: time-api.jacm.com.mx)'
        required: false
        type: string
        default: ''
      jwt_required:
        description: 'Fallar si JWT_SECRET no está configurado'
        required: false
        type: boolean
        default: false
      mongo_required:
        description: 'Fallar si MONGO_* no está configurado'
        required: false
        type: boolean
        default: false
    secrets:
      DO_HOST:
        required: false
      DO_USER:
        required: false
      DO_SSH_KEY:
        required: false
      DO_PORT:
        required: false
      JWT_SECRET:
        required: false
      MONGO_ROOT_PASSWORD:
        required: false
      MONGO_APP_PASSWORD:
        required: false
      MONGO_ROOT_USERNAME:
        required: false
      MONGO_APP_USERNAME:
        required: false
      SPACES_ACCESS_KEY:
        required: false
      SPACES_SECRET_KEY:
        required: false
      SPACES_BUCKET:
        required: false
      SPACES_REGION:
        required: false
      SPACES_ENDPOINT:
        required: false
      EMAIL_SERVICE:
        required: false
      EMAIL_FROM:
        required: false
      SMTP_HOST:
        required: false
      SMTP_PORT:
        required: false
      SMTP_SECURE:
        required: false
      SMTP_USER:
        required: false
      SMTP_PASSWORD:
        required: false

jobs:
  build-and-push:
    name: Build y push imágenes a ghcr.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Verify required secrets
        if: inputs.jwt_required || inputs.mongo_required
        run: |
          if [ "${{ inputs.jwt_required }}" = "true" ] && [ -z "${{ secrets.JWT_SECRET }}" ]; then
            echo "❌ JWT_SECRET es obligatorio para esta app pero no está configurado en GitHub Secrets."
            exit 1
          fi
          if [ "${{ inputs.mongo_required }}" = "true" ] && [ -z "${{ secrets.MONGO_ROOT_PASSWORD }}" ]; then
            echo "❌ MONGO_ROOT_PASSWORD es obligatorio pero no está configurado en GitHub Secrets."
            exit 1
          fi
          if [ "${{ inputs.mongo_required }}" = "true" ] && [ -z "${{ secrets.MONGO_APP_PASSWORD }}" ]; then
            echo "❌ MONGO_APP_PASSWORD es obligatorio pero no está configurado en GitHub Secrets."
            exit 1
          fi

      - name: Checkout del repo de la app
        uses: actions/checkout@v4

      - name: Login a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build y push imágenes
        env:
          FRONTEND_DOMAIN: ${{ inputs.frontend_domain }}
          BACKEND_DOMAIN: ${{ inputs.backend_domain }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MONGO_ROOT_USERNAME: ${{ secrets.MONGO_ROOT_USERNAME }}
          MONGO_APP_USERNAME: ${{ secrets.MONGO_APP_USERNAME }}
          MONGO_ROOT_PASSWORD: ${{ secrets.MONGO_ROOT_PASSWORD }}
          MONGO_APP_PASSWORD: ${{ secrets.MONGO_APP_PASSWORD }}
        run: |
          # docker compose valida todo el archivo aunque solo se construyan backend/frontend
          export MONGO_ROOT_USERNAME="${MONGO_ROOT_USERNAME:-jacm_admin}"
          export MONGO_APP_USERNAME="${MONGO_APP_USERNAME:-jacm_app}"
          export MONGO_ROOT_PASSWORD="${MONGO_ROOT_PASSWORD:-build-placeholder-not-used}"
          export MONGO_APP_PASSWORD="${MONGO_APP_PASSWORD:-build-placeholder-not-used}"
          export JWT_SECRET="${JWT_SECRET:-build-placeholder-not-used}"
          docker compose build
          docker compose push

  deploy:
    name: Deploy ${{ inputs.app_name }} en servidor
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    permissions:
      contents: read
      packages: read

    steps:
      - name: Verify deploy credentials
        run: |
          missing=0
          if [ -z "${{ secrets.DO_HOST || vars.DO_HOST }}" ]; then
            echo "❌ DO_HOST no está en Secrets ni Variables del repo"
            missing=1
          fi
          if [ -z "${{ secrets.DO_USER || vars.DO_USER }}" ]; then
            echo "❌ DO_USER no está en Secrets ni Variables del repo"
            missing=1
          fi
          if [ -z "${{ secrets.DO_SSH_KEY || vars.DO_SSH_KEY }}" ]; then
            echo "❌ DO_SSH_KEY no está en Secrets ni Variables del repo"
            missing=1
          fi
          if [ "$missing" -eq 1 ]; then
            exit 1
          fi
          echo "✅ Credenciales de deploy encontradas (Secrets o Variables)"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ github.token }}
        with:
          host: ${{ secrets.DO_HOST || vars.DO_HOST }}
          username: ${{ secrets.DO_USER || vars.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY || vars.DO_SSH_KEY }}
          port: ${{ secrets.DO_PORT || vars.DO_PORT || 22 }}
          envs: GHCR_TOKEN
          script: |
            set -e

            if [ "${{ inputs.jwt_required }}" = "true" ] && [ -z "${{ secrets.JWT_SECRET }}" ]; then
              echo "❌ JWT_SECRET es obligatorio para esta app pero no está configurado en GitHub Secrets."
              exit 1
            fi
            if [ "${{ inputs.mongo_required }}" = "true" ] && [ -z "${{ secrets.MONGO_ROOT_PASSWORD }}" ]; then
              echo "❌ MONGO_ROOT_PASSWORD es obligatorio pero no está configurado en GitHub Secrets."
              exit 1
            fi
            if [ "${{ inputs.mongo_required }}" = "true" ] && [ -z "${{ secrets.MONGO_APP_PASSWORD }}" ]; then
              echo "❌ MONGO_APP_PASSWORD es obligatorio pero no está configurado en GitHub Secrets."
              exit 1
            fi

            # Verificar que la app esté habilitada en apps.yml del servidor
            ENABLED=$(python3 - <<'PYEOF'
            import re, sys
            app_name = "${{ inputs.app_name }}"
            with open("/opt/container-apps/apps.yml") as f:
                content = f.read()
            apps = []
            current = {}
            for line in content.splitlines():
                m = re.match(r'\s+-\s+name:\s+(.+)', line)
                if m:
                    if current:
                        apps.append(current)
                    current = {"name": m.group(1).strip()}
                    continue
                for key in ("enabled",):
                    m = re.match(rf'\s+{key}:\s+(.+)', line)
                    if m:
                        current[key] = m.group(1).strip()
            if current:
                apps.append(current)
            for app in apps:
                if app.get("name") == app_name:
                    print(app.get("enabled", "true").lower())
                    break
            else:
                print("missing")
            PYEOF
            )
            if [ "$ENABLED" = "false" ]; then
              echo "⏭️  App '${{ inputs.app_name }}' está deshabilitada en apps.yml. Deploy omitido."
              exit 0
            fi
            if [ "$ENABLED" = "missing" ]; then
              echo "❌ App '${{ inputs.app_name }}' no está registrada en apps.yml."
              exit 1
            fi

            # Login al registry para poder hacer pull (github.token, no secrets.GITHUB_TOKEN)
            echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            APP_DIR="/opt/apps/${{ inputs.app_name }}"

            # Clonar si no existe, actualizar si ya existe
            if [ ! -d "$APP_DIR" ]; then
              mkdir -p /opt/apps
              git clone --branch ${{ inputs.branch }} https://github.com/${{ github.repository }}.git "$APP_DIR"
            else
              cd "$APP_DIR"
              git fetch origin ${{ inputs.branch }}
              git reset --hard "origin/${{ inputs.branch }}"
            fi

            cd "$APP_DIR"

            # Crear/actualizar .env con las variables de dominio y secretos
            {
              [ -n "${{ inputs.frontend_domain }}" ] && echo "FRONTEND_DOMAIN=${{ inputs.frontend_domain }}"
              [ -n "${{ inputs.backend_domain }}" ]  && echo "BACKEND_DOMAIN=${{ inputs.backend_domain }}"
              [ -n "${{ secrets.JWT_SECRET }}" ]     && echo "JWT_SECRET=${{ secrets.JWT_SECRET }}"
              [ -n "${{ secrets.MONGO_ROOT_USERNAME }}" ] && echo "MONGO_ROOT_USERNAME=${{ secrets.MONGO_ROOT_USERNAME }}"
              [ -n "${{ secrets.MONGO_ROOT_USERNAME }}" ] || echo "MONGO_ROOT_USERNAME=jacm_admin"
              [ -n "${{ secrets.MONGO_APP_USERNAME }}" ]  && echo "MONGO_APP_USERNAME=${{ secrets.MONGO_APP_USERNAME }}"
              [ -n "${{ secrets.MONGO_APP_USERNAME }}" ]  || echo "MONGO_APP_USERNAME=jacm_app"
              [ -n "${{ secrets.MONGO_ROOT_PASSWORD }}" ] && echo "MONGO_ROOT_PASSWORD=${{ secrets.MONGO_ROOT_PASSWORD }}"
              [ -n "${{ secrets.MONGO_APP_PASSWORD }}" ]  && echo "MONGO_APP_PASSWORD=${{ secrets.MONGO_APP_PASSWORD }}"
              [ -n "${{ secrets.SPACES_ACCESS_KEY }}" ]   && echo "SPACES_ACCESS_KEY=${{ secrets.SPACES_ACCESS_KEY }}"
              [ -n "${{ secrets.SPACES_SECRET_KEY }}" ]   && echo "SPACES_SECRET_KEY=${{ secrets.SPACES_SECRET_KEY }}"
              [ -n "${{ secrets.SPACES_BUCKET }}" ]       && echo "SPACES_BUCKET=${{ secrets.SPACES_BUCKET }}"
              [ -n "${{ secrets.SPACES_REGION }}" ]         && echo "SPACES_REGION=${{ secrets.SPACES_REGION }}"
              [ -n "${{ secrets.SPACES_ENDPOINT }}" ]     && echo "SPACES_ENDPOINT=${{ secrets.SPACES_ENDPOINT }}"
              echo "EMAIL_SERVICE=${{ secrets.EMAIL_SERVICE || vars.EMAIL_SERVICE || 'godaddy' }}"
              if [ -n "${{ secrets.EMAIL_FROM || vars.EMAIL_FROM }}" ]; then
                echo "EMAIL_FROM=\"${{ secrets.EMAIL_FROM || vars.EMAIL_FROM }}\""
              else
                echo 'EMAIL_FROM="JACM Time Record <info@jacm.com.mx>"'
              fi
              echo "SMTP_HOST=${{ secrets.SMTP_HOST || vars.SMTP_HOST || 'smtpout.secureserver.net' }}"
              echo "SMTP_PORT=${{ secrets.SMTP_PORT || vars.SMTP_PORT || '465' }}"
              echo "SMTP_SECURE=${{ secrets.SMTP_SECURE || vars.SMTP_SECURE || 'true' }}"
              [ -n "${{ secrets.SMTP_USER || vars.SMTP_USER }}" ] && echo "SMTP_USER=${{ secrets.SMTP_USER || vars.SMTP_USER }}"
              [ -n "${{ secrets.SMTP_PASSWORD }}" ]           && echo "SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}"
              echo "DUE_ALERT_HOUR=${{ vars.DUE_ALERT_HOUR || '8' }}"
            } > "$APP_DIR/.env"

            chmod +x "$APP_DIR/scripts/"*.sh 2>/dev/null || true

            # Pull de imágenes pre-compiladas
            docker compose --env-file "$APP_DIR/.env" pull

            # Migrar Mongo a auth si aplica (idempotente; no levantar mongo con auth antes)
            if [ -f "$APP_DIR/scripts/setup-mongo-auth.sh" ] && [ -n "${{ secrets.MONGO_ROOT_PASSWORD }}" ]; then
              bash "$APP_DIR/scripts/setup-mongo-auth.sh"
            fi

            # Levantar el resto de servicios
            docker compose --env-file "$APP_DIR/.env" up -d --no-build --force-recreate --remove-orphans
