name: Deploy app (reusable)
# ============================================================
# Workflow reutilizable — llámalo desde cualquier repo de app
#
# En tu repo de app, crea .github/workflows/deploy.yml con:
#
#   jobs:
#     deploy:
#       uses: Jonathan1612/container-apps/.github/workflows/deploy-app.yml@dev
#       with:
#         app_name: mi-api          # nombre en apps.yml
#       secrets: inherit
#
# Secrets necesarios en el repo de la app:
#   DO_HOST, DO_USER, DO_SSH_KEY — credenciales SSH del servidor
# ============================================================

on:
  workflow_call:
    inputs:
      app_name:
        description: 'Nombre de la app (debe coincidir con apps.yml)'
        required: true
        type: string
      branch:
        description: 'Rama a desplegar'
        required: false
        type: string
        default: 'main'
    secrets:
      DO_HOST:
        required: true
      DO_USER:
        required: true
      DO_SSH_KEY:
        required: true
      DO_PORT:
        required: false

jobs:
  build-and-push:
    name: Build y push imágenes a ghcr.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout del repo de la app
        uses: actions/checkout@v4

      - name: Login a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push imágenes
        run: |
          # Las imágenes ya tienen el nombre completo definido en docker-compose.yml
          # docker compose build + push usa esos nombres directamente
          docker compose build
          docker compose push

  deploy:
    name: Deploy ${{ inputs.app_name }} en servidor
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: ${{ secrets.DO_PORT || 22 }}
          script: |
            set -e
            # Login al registry para poder hacer pull
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            APP_DIR="/opt/apps/${{ inputs.app_name }}"

            # Clonar si no existe, actualizar si ya existe
            if [ ! -d "$APP_DIR" ]; then
              mkdir -p /opt/apps
              git clone --branch ${{ inputs.branch }} https://github.com/${{ github.repository }}.git "$APP_DIR"
            else
              cd "$APP_DIR"
              git pull origin ${{ inputs.branch }}
            fi

            cd "$APP_DIR"

            # Pull de imágenes pre-compiladas y levantar sin rebuild
            docker compose pull
            docker compose up -d --no-build
